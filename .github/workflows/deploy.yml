# Build the game and publish it to GitHub Pages.
# Runs for main (production) and game-overhaul (preview of the PR branch);
# the most recent push wins the single Pages site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, game-overhaul]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Optional: a TURN relay for the published game, so players on
          # networks that block peer-to-peer can still play without setting
          # up a relay of their own. Unset simply falls back to the
          # best-effort public relays. See NETPLAY.md.
          VITE_ICE_ENDPOINT: ${{ secrets.ICE_ENDPOINT }}
          VITE_TURN_URLS: ${{ secrets.TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
